name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --desc on || echo "pip-audit findings reported (non-blocking until triaged)"
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json --of JSON
          echo "SBOM generated: $(wc -c < sbom.json) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
